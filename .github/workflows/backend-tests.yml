name: Backend Tests

on:
  push:
    branches: [main, Dev-Ahian]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas unitarias con cobertura
        run: python -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80
